# /etc/material-grub.conf: runtime options for the Material GRUB theme (KEY=value, "#" starts a comment).
# Apply changes with:  sudo material-boot grub apply
#
# RAW_NAME=on     the small muted line at the bottom with the entry title exactly as GRUB sees it (on|off)
# COUNTDOWN=on    the "Booting in N seconds" bar and label (on|off)
# LOGO=on         the firmware (BGRT) logo in the top-right cookie (on|off)
# COOKIE=on       the top-right cookie shape itself; off also hides the logo (on|off)
# HINTS=on        the key-hint pills (Arrows select, Enter boot, ...) (on|off)
# STYLE=rail      rail = full screen with the icon rail, clean = full screen with peek panels and label chips, list = centred list, split = hero on the left and list on the right (rail|clean|list|split)
# SCHEME=dark     records which colour scheme the theme was built with (dark|light); changing it here does not rebuild, use ./install.sh --scheme
# MODE=dynamic    Ventoy sticks only (dynamic|snapshot), see docs/ventoy.md
# PLYMOUTH=on     the Plymouth boot splash, when the optional material-plymouth part is installed (on|off); ignored otherwise
# PLYMOUTH_BAR=indeterminate   its wavy progress bar: a travelling wave, or one that follows Plymouth's boot progress (indeterminate|progress)
# PLYMOUTH_MOTION=full         its animation level: full, calm (slower, cheaper) or off (still) (full|calm|off)
# TIMEOUT=        seconds before the default entry boots; empty = GRUB_TIMEOUT (or 5)
#
# Not here, because the palette is baked into the scene images at build time:
#   colour scheme   sudo ./install.sh --scheme light
#RAW_NAME=on
#COUNTDOWN=on
#LOGO=on
#COOKIE=on
#HINTS=on
#STYLE=rail
#TIMEOUT=
#PLYMOUTH=on
#PLYMOUTH_BAR=indeterminate
#PLYMOUTH_MOTION=full
