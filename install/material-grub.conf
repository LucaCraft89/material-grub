# /etc/material-grub.conf: runtime options for the Material GRUB theme (KEY=value, "#" starts a comment).
# Apply changes with:  sudo material-grub-apply
#
# RAW_NAME=on     the small muted line at the bottom with the entry title exactly as GRUB sees it (on|off)
# COUNTDOWN=on    the "Booting in N seconds" bar and label (on|off)
# LOGO=on         the firmware (BGRT) logo in the top-right cookie (on|off)
# TIMEOUT=        seconds before the default entry boots; empty = GRUB_TIMEOUT (or 5)
#
# Not here, because they are baked into the scene images at build time:
#   colour scheme   sudo ./install.sh --scheme light
#   key-hint pills  sudo ./install.sh --no-hints
#RAW_NAME=on
#COUNTDOWN=on
#LOGO=on
#TIMEOUT=
