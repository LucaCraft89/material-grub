name: CI
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}

jobs:
  checks:
    name: Syntax and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-pil librsvg2-bin grub-common
      - run: python3 -m venv --system-site-packages .venv && .venv/bin/pip install -r requirements.txt
      - run: .venv/bin/python scripts/package.py --res 1920x1080
      - run: PATH="$PWD/.venv/bin:$PATH" sh tests/run.sh

  installer:
    name: Installer on ${{ matrix.name }} (${{ matrix.scheme }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Fedora,      image: "registry.fedoraproject.org/fedora:latest",       res: 3840x2160, scheme: dark}
          - {name: Ubuntu,      image: "docker.io/library/ubuntu:24.04",                 res: 2880x1800, scheme: light}
          - {name: Debian,      image: "docker.io/library/debian:stable",                res: 1920x1080, scheme: dark}
          - {name: Arch,        image: "docker.io/library/archlinux:latest",             res: 1920x1200, scheme: light}
          - {name: openSUSE,    image: "registry.opensuse.org/opensuse/tumbleweed:latest", res: 2560x1080, scheme: dark}
          - {name: Alpine,      image: "docker.io/library/alpine:latest",                res: 5120x1440, scheme: light}
    steps:
      - uses: actions/checkout@v4
      - name: Build in a fresh container (installs only missing dependencies, stops before touching GRUB)
        run: |
          docker run --rm -v "$PWD:/src:ro" "${{ matrix.image }}" \
            sh -c "cd /src && ./install.sh --stage-only --res ${{ matrix.res }} --scheme ${{ matrix.scheme }}"

  boot:
    name: Boot in QEMU (${{ matrix.scheme }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {scheme: [dark, light]}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf grub-efi-amd64-bin grub-common librsvg2-bin python3-pil
      - name: Enable KVM when the runner has it
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "no KVM: QEMU falls back to software emulation (slower)"
      - run: python3 -m venv --system-site-packages .venv && .venv/bin/pip install -r requirements.txt
      - run: .venv/bin/python scripts/package.py --res 1920x1080 --scheme ${{ matrix.scheme }}
      - run: |
          [ -w /dev/kvm ] && W=20 || W=90
          BOOT_WAIT=$W KEY_WAIT=4 .venv/bin/python tests/boot_smoke.py 1920x1080 ${{ matrix.scheme }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "boot-${{ matrix.scheme }}", path: build/ci-shots/}
