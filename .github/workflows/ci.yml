name: CI
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:      # also regenerates the distro gallery images (job gallery-render)
permissions: {contents: read}
# material-boot-core is checked out at the ref in the repository variable MATERIAL_CORE_REF; until the core's PRs are merged that is the branch that holds them
# (feat/packages), after that it is main, then a tag.

env:
  # the core checked out inside the workspace; explicit, because some tests run the tools from a temporary copy of the package, where walking up finds nothing
  MATERIAL_LIB: ${{ github.workspace }}/material-boot-core

jobs:
  lint:
    name: Lint (ruff, shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4     # material-boot-core: the shared code the tools import (install/bin/mgcore.py finds it inside the workspace)
        with: {repository: LucaCraft89/material-boot-core, ref: "${{ vars.MATERIAL_CORE_REF || 'feat/ctx-json' }}", path: material-boot-core}
      - run: pipx install ruff shellcheck-py
      - run: ruff check .
      - run: ruff format --check .
      - run: shellcheck -x --severity=warning install.sh install/*.sh install/05_material install/15_material_menu install/90_material_system tests/run.sh packaging/common/*.sh
      - run: for f in gui/web/*.js; do node --check "$f"; done      # the GUI front end has no build step: a syntax error would only show in the browser

  checks:
    name: Syntax and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4     # material-boot-core: the shared code the tools import (install/bin/mgcore.py finds it inside the workspace)
        with: {repository: LucaCraft89/material-boot-core, ref: "${{ vars.MATERIAL_CORE_REF || 'feat/ctx-json' }}", path: material-boot-core}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-pil librsvg2-bin grub-common
      - run: python3 -m venv --system-site-packages .venv && .venv/bin/pip install --require-hashes -r requirements.txt
      - run: .venv/bin/python scripts/package.py --res 1920x1080
      - run: PATH="$PWD/.venv/bin:$PATH" sh tests/run.sh
      - run: .venv/bin/python scripts/gen_gui_tokens.py && git diff --exit-code gui/web/tokens.css      # the GUI's colours are generated, never edited by hand

  requirements:
    name: Pinned requirements on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    container: python:${{ matrix.python }}-slim
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4     # material-boot-core: the shared code the tools import (install/bin/mgcore.py finds it inside the workspace)
        with: {repository: LucaCraft89/material-boot-core, ref: "${{ vars.MATERIAL_CORE_REF || 'feat/ctx-json' }}", path: material-boot-core}
      - run: python -m venv .venv && .venv/bin/pip install --require-hashes -r requirements.txt
      - run: .venv/bin/python -c "import fontTools, materialyoucolor, PIL; print(PIL.__version__)"
      - run: python scripts/update_requirements.py --check   # the pins still match requirements.in (PyPI hashes)

  installer:
    name: Installer on ${{ matrix.name }} (${{ matrix.scheme }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Fedora,      image: "registry.fedoraproject.org/fedora:latest",       res: 3840x2160, scheme: dark}
          - {name: Ubuntu,      image: "docker.io/library/ubuntu:24.04",                 res: 2880x1800, scheme: light}
          - {name: Debian,      image: "docker.io/library/debian:stable",                res: 1920x1080, scheme: dark}
          - {name: Arch,        image: "docker.io/library/archlinux:latest",             res: 1920x1200, scheme: light}
          - {name: openSUSE,    image: "registry.opensuse.org/opensuse/tumbleweed:latest", res: 2560x1080, scheme: dark}
          - {name: AlmaLinux 8 (Python 3.6 by default), image: "docker.io/library/almalinux:8",     res: 1920x1080, scheme: dark}
          - {name: Alpine,      image: "docker.io/library/alpine:latest",                res: 5120x1440, scheme: light}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4     # material-boot-core: the shared code the tools import (install/bin/mgcore.py finds it inside the workspace)
        with: {repository: LucaCraft89/material-boot-core, ref: "${{ vars.MATERIAL_CORE_REF || 'feat/ctx-json' }}", path: material-boot-core}
      - name: Build in a fresh container (installs only missing dependencies, stops before touching GRUB)
        run: |
          docker run --rm -v "$PWD:/src:ro" "${{ matrix.image }}" \
            sh -c "cd /src && ./install.sh --stage-only --res ${{ matrix.res }} --scheme ${{ matrix.scheme }}"

  boot:
    # Fedora container: its GRUB build has blscfg.mod (Debian/Ubuntu's does not), which the BLS test menu needs. Software emulation, so long waits.
    name: Boot in QEMU (${{ matrix.scheme }}, ${{ matrix.style }})
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:latest
    strategy:
      fail-fast: false
      matrix:
        include:      # every style in dark, plus rail and list in light
          - {scheme: dark,  style: rail}
          - {scheme: dark,  style: clean}
          - {scheme: dark,  style: list}
          - {scheme: light, style: rail}
          - {scheme: light, style: list}
    steps:
      - run: dnf install -y qemu-system-x86-core edk2-ovmf grub2-tools grub2-tools-extra grub2-efi-x64-modules librsvg2-tools python3-pillow python3-pip git
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4     # material-boot-core: the shared code the tools import (install/bin/mgcore.py finds it inside the workspace)
        with: {repository: LucaCraft89/material-boot-core, ref: "${{ vars.MATERIAL_CORE_REF || 'feat/ctx-json' }}", path: material-boot-core}
      - run: python3 -m venv --system-site-packages .venv && .venv/bin/pip install --require-hashes -r requirements.txt
      - run: .venv/bin/python scripts/package.py --res 1920x1080 --scheme ${{ matrix.scheme }}
      - run: BOOT_WAIT=90 KEY_WAIT=4 .venv/bin/python tests/boot_smoke.py 1920x1080 ${{ matrix.scheme }} ${{ matrix.style }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "boot-${{ matrix.scheme }}-${{ matrix.style }}", path: build/ci-shots/}

  resolution:
    # A screen with no built-in size (1360x768): the theme must fill it, stay centred when the firmware picks a near-by mode, and fall back to the basic theme.
    name: Boot on an awkward screen size
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:latest
    steps:
      - run: dnf install -y qemu-system-x86-core edk2-ovmf grub2-tools grub2-tools-extra grub2-efi-x64-modules librsvg2-tools python3-pillow python3-pip git
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4     # material-boot-core: the shared code the tools import (install/bin/mgcore.py finds it inside the workspace)
        with: {repository: LucaCraft89/material-boot-core, ref: "${{ vars.MATERIAL_CORE_REF || 'feat/ctx-json' }}", path: material-boot-core}
      - run: python3 -m venv --system-site-packages .venv && .venv/bin/pip install --require-hashes -r requirements.txt
      - run: .venv/bin/python scripts/package.py --res 1280x720,1920x1080
      - run: BOOT_WAIT=90 KEY_WAIT=4 .venv/bin/python tests/boot_resolution.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "boot-resolution", path: build/res-*.png}

  features:
    # The 0.7 customisations in a real GRUB (QEMU/OVMF): one seed colour, a custom entry colour and name, Windows first, hidden entries, and the firmware
    # logo (the penguin on a machine without one) in the cookie; every style. The screenshots are artifacts (they feed the docs gallery).
    name: Features in QEMU (${{ matrix.scheme }}, ${{ matrix.style }})
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {scheme: dark,  style: rail}
          - {scheme: dark,  style: clean}
          - {scheme: dark,  style: list}
          - {scheme: dark,  style: split}
          - {scheme: light, style: rail}
          - {scheme: light, style: split}
    steps:
      - run: dnf install -y qemu-system-x86-core edk2-ovmf grub2-tools grub2-tools-extra grub2-efi-x64-modules librsvg2-tools python3-pillow python3-pip git
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4     # material-boot-core: the shared code the tools import (install/bin/mgcore.py finds it inside the workspace)
        with: {repository: LucaCraft89/material-boot-core, ref: "${{ vars.MATERIAL_CORE_REF || 'feat/ctx-json' }}", path: material-boot-core}
      - run: python3 -m venv --system-site-packages .venv && .venv/bin/pip install --require-hashes -r requirements.txt
      - run: .venv/bin/python scripts/package.py --res 1920x1080 --scheme ${{ matrix.scheme }}
      - run: |
          for sc in single entry order hidden logo; do
            BOOT_WAIT=90 KEY_WAIT=4 .venv/bin/python tests/boot_features.py $sc ${{ matrix.style }} || exit 1
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "features-${{ matrix.scheme }}-${{ matrix.style }}", path: build/feature-shots/}

  gui:
    # The GUI in a real browser (Chrome, driven by Playwright): every page, the live preview, drag and drop, edits, Apply through the real helper (scratch root,
    # fake `material-grub apply`), a failing Apply, Ventoy, the update page, phone width, dark and light, and the browser-side security. Screenshots are artifacts.
    name: GUI in Chrome (end to end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4     # material-boot-core: the shared code the tools import (install/bin/mgcore.py finds it inside the workspace)
        with: {repository: LucaCraft89/material-boot-core, ref: "${{ vars.MATERIAL_CORE_REF || 'feat/ctx-json' }}", path: material-boot-core}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-pil librsvg2-bin grub-common
      - run: python3 -m venv --system-site-packages .venv && .venv/bin/pip install --require-hashes -r requirements.txt
      - run: .venv/bin/pip install playwright      # test tooling only; the browser is the runner's Chrome, nothing is downloaded
      - run: .venv/bin/python scripts/package.py --res 1920x1080
      - run: GUI_BROWSER=/usr/bin/google-chrome .venv/bin/python tests/gui_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: gui-screenshots, path: build/gui-shots/}

  safety:
    # The safety nets in a real GRUB: a theme that is missing at boot gives the plain menu, and a broken rewrite is rolled back (QEMU/OVMF, Fedora container like `boot`).
    name: Safety nets in QEMU (plain-menu fallback, rollback)
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:latest
    steps:
      - run: dnf install -y qemu-system-x86-core edk2-ovmf grub2-tools grub2-tools-extra grub2-efi-x64-modules librsvg2-tools python3-pillow python3-pip git
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4     # material-boot-core: the shared code the tools import (install/bin/mgcore.py finds it inside the workspace)
        with: {repository: LucaCraft89/material-boot-core, ref: "${{ vars.MATERIAL_CORE_REF || 'feat/ctx-json' }}", path: material-boot-core}
      - run: python3 -m venv --system-site-packages .venv && .venv/bin/pip install --require-hashes -r requirements.txt
      - run: .venv/bin/python scripts/package.py --res 1920x1080
      - run: BOOT_WAIT=90 KEY_WAIT=4 .venv/bin/python tests/fallback_smoke.py 1920x1080 dark
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: safety-shots, path: build/fallback-*.png}

  dry-run:
    # `install.sh --dry-run` as root in a distro container with a fake /boot: it must show a diff and leave the system byte for byte unchanged.
    name: Dry run on ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Debian, distro: debian, image: "docker.io/library/debian:stable"}
          - {name: Fedora, distro: fedora, image: "registry.fedoraproject.org/fedora:latest"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4     # material-boot-core: the shared code the tools import (install/bin/mgcore.py finds it inside the workspace)
        with: {repository: LucaCraft89/material-boot-core, ref: "${{ vars.MATERIAL_CORE_REF || 'feat/ctx-json' }}", path: material-boot-core}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-pil librsvg2-bin grub-common
      - run: python3 -m venv --system-site-packages .venv && .venv/bin/pip install --require-hashes -r requirements.txt
      - run: .venv/bin/python scripts/package.py --res 1920x1080
      - run: |
          mkdir -p build/out
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/build/out:/out" "${{ matrix.image }}" sh /src/tests/containers/dry_run.sh ${{ matrix.distro }}
          cat build/out/dry-${{ matrix.distro }}.txt
          grep -q "^exit: 0" build/out/dry-${{ matrix.distro }}.txt
          grep -q "^SYSTEM UNCHANGED" build/out/dry-${{ matrix.distro }}.txt

  unified:
    # The GRUB part for real, in a distro container with a fake /boot: install the core through `material-boot core install`, install GRUB with install.sh and
    # through `material-boot core install --only grub`: the same files must be on the system; then remove it through the unified installer.
    name: Unified installer on ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Debian, distro: debian, image: "docker.io/library/debian:stable"}
          - {name: Fedora, distro: fedora, image: "registry.fedoraproject.org/fedora:latest"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4     # material-boot-core: the shared code the tools import, and the core of the bundle the test makes
        with: {repository: LucaCraft89/material-boot-core, ref: "${{ vars.MATERIAL_CORE_REF || 'feat/ctx-json' }}", path: material-boot-core}
      - run: |
          mkdir -p build/out
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/build/out:/out" "${{ matrix.image }}" sh /src/tests/containers/unified_smoke.sh ${{ matrix.distro }}
          cat build/out/unified-${{ matrix.distro }}.txt
          grep -q "^ALL OK" build/out/unified-${{ matrix.distro }}.txt

  packages:
    # Source-only packages: build each from the checked-out tree, install it in a distro container with a fake /boot (the theme is built on install),
    # upgrade it, and force a rejected upgrade: the package manager must still succeed and grub.cfg must be rolled back.
    name: Package ${{ matrix.fmt }} (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {fmt: rpm,  name: Fedora, image: "registry.fedoraproject.org/fedora:latest"}
          - {fmt: deb,  name: Debian, image: "docker.io/library/debian:stable"}
          - {fmt: arch, name: Arch,   image: "docker.io/library/archlinux:latest"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4     # material-boot-core: the shared code the tools import (install/bin/mgcore.py finds it inside the workspace)
        with: {repository: LucaCraft89/material-boot-core, ref: "${{ vars.MATERIAL_CORE_REF || 'feat/ctx-json' }}", path: material-boot-core}
      - run: |
          mkdir -p build/pkg build/out
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/build/pkg:/out" "${{ matrix.image }}" sh /src/tests/containers/build_pkg.sh ${{ matrix.fmt }}
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/build/pkg:/pkg:ro" -v "$PWD/build/out:/out" "${{ matrix.image }}" sh /src/tests/containers/pkg_smoke.sh ${{ matrix.fmt }}
      - run: cat build/out/pkg-${{ matrix.fmt }}.txt; grep -q "^ALL OK" build/out/pkg-${{ matrix.fmt }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "package-${{ matrix.fmt }}", path: build/out/}

  ventoy:
    # Real Ventoy 1.1.18 (downloaded, sha256 checked) booted in QEMU/OVMF with the theme installed; ISOs are then added, renamed and removed WITHOUT running the installer again.
    # Software emulation on the runner, so the script waits 4x longer.
    name: Ventoy stick in QEMU (dynamic list, ISOs change)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4     # material-boot-core: the shared code the tools import (install/bin/mgcore.py finds it inside the workspace)
        with: {repository: LucaCraft89/material-boot-core, ref: "${{ vars.MATERIAL_CORE_REF || 'feat/ctx-json' }}", path: material-boot-core}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf mtools python3-pil librsvg2-bin grub-common
      - run: python3 -m venv --system-site-packages .venv && .venv/bin/pip install --require-hashes -r requirements.txt
      - run: .venv/bin/python scripts/package.py --res 1920x1080
      - run: PATH="$PWD/.venv/bin:$PATH" python3 tests/ventoy_smoke.py

  ventoy-features:
    # Real Ventoy 1.1.18 with the 0.7 customisations: per-image colour, icon and name and the one-colour mode on the stick, in both Ventoy styles and both modes, and the same
    # made through the GUI in Chrome (the GUI writes the stick, then it is booted). Software emulation on the runner, so the script waits 4x longer. Screenshots are artifacts.
    name: Ventoy features in QEMU (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [list-dynamic, full-dynamic, list-snapshot, single, gui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4     # material-boot-core: the shared code the tools import (install/bin/mgcore.py finds it inside the workspace)
        with: {repository: LucaCraft89/material-boot-core, ref: "${{ vars.MATERIAL_CORE_REF || 'feat/ctx-json' }}", path: material-boot-core}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf mtools python3-pil librsvg2-bin grub-common
      - run: python3 -m venv --system-site-packages .venv && .venv/bin/pip install --require-hashes -r requirements.txt
      - run: .venv/bin/pip install playwright      # only the gui scenario drives a browser (the runner's Chrome; nothing is downloaded)
      - run: .venv/bin/python scripts/package.py --res 1920x1080
      - run: PATH="$PWD/.venv/bin:$PATH" GUI_BROWSER=/usr/bin/google-chrome .venv/bin/python tests/ventoy_features.py ${{ matrix.scenario }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "ventoy-features-${{ matrix.scenario }}", path: build/ventoy-feature-shots/}

  gallery:
    name: Distro gallery is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4     # material-boot-core: the shared code the tools import (install/bin/mgcore.py finds it inside the workspace)
        with: {repository: LucaCraft89/material-boot-core, ref: "${{ vars.MATERIAL_CORE_REF || 'feat/ctx-json' }}", path: material-boot-core}
      - run: python3 scripts/gen_distro_table.py --check      # tables vs catalog + image file list; PNG bytes are never compared

  gallery-render:
    name: Regenerate distro gallery images (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4     # material-boot-core: the shared code the tools import (install/bin/mgcore.py finds it inside the workspace)
        with: {repository: LucaCraft89/material-boot-core, ref: "${{ vars.MATERIAL_CORE_REF || 'feat/ctx-json' }}", path: material-boot-core}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-pil librsvg2-bin grub-common
      - run: python3 -m venv --system-site-packages .venv && .venv/bin/pip install --require-hashes -r requirements.txt
      - run: .venv/bin/python scripts/package.py --res 1920x1080 --scheme dark && .venv/bin/python scripts/gen_distro_table.py
      - uses: actions/upload-artifact@v4
        with: {name: distro-gallery, path: "docs/distros.md\ndocs/distros/"}
