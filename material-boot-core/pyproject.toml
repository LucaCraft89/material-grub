[project]
name = "material-boot-core"
version = "1.0.0"   # kept equal to VERSION (tests/test_skeleton.py checks it)
description = "The code Material GRUB and Material Plymouth share, and the material-boot command"
requires-python = ">=3.9"
license = {text = "MIT"}

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["material_boot/_vendor"]   # unmodified copy of a third-party package

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# E501: `ruff format` wraps code; long comments and message strings are left as written.
ignore = ["E501"]
